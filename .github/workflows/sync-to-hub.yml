name: Publicar no hub de auditoria

on:
  push:
    branches: [main]
    paths:
      - index.html
      - viewer.html
      - tools/gerar_base_sazonalidade.py

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Controle de Lotes
        uses: actions/checkout@v4

      - name: Checkout hub (auditoria)
        uses: actions/checkout@v4
        with:
          repository: joaovitorsmg-cmd/auditoria
          token: ${{ secrets.HUB_DEPLOY_TOKEN }}
          path: hub

      - name: Copiar arquivos para a pasta do painel
        run: |
          mkdir -p hub/controledelote/tools
          cp index.html hub/controledelote/index.html
          cp viewer.html hub/controledelote/viewer.html
          cp tools/gerar_base_sazonalidade.py hub/controledelote/tools/gerar_base_sazonalidade.py

      - name: Commit e push no hub
        run: |
          cd hub
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add controledelote
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Atualiza painel Controle de Lotes (automático)"
            git push
          fi
